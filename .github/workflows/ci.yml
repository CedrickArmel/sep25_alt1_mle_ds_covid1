name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: pip install black isort flake8

      - name: black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: flake8
        run: flake8 .

  # ---------------------------------------------------------------------------
  # 2) Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install workspace
        run: uv sync --all-packages --group test

      - name: Run tests
        env:
          WANDB_MODE: offline
        run: uv run pytest radiocovid-inference/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 3) Build & Push Docker images
  # ---------------------------------------------------------------------------
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets not set — skipping push."
          fi

      - name: Log in to Docker Hub
        if: steps.check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push ETL image
        if: steps.check.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/etl
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/radiocovid-etl:latest

      - name: Build & push Train image
        if: steps.check.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/train
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/radiocovid-train:latest

      - name: Build & push Inference image
        if: steps.check.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/inference/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/radiocovid-inference:latest
