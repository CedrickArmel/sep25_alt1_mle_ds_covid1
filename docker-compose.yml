services:

  etl:
    build:
      context: docker/etl
      dockerfile: Dockerfile
    image: radiocovid-etl:0.1.0
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data/01_raw/COVID-19_Radiography_Dataset
      MANIFEST_PATH: /data/manifest.parquet
      TRAIN_FOLDER_DIR: /data/train_folder
    profiles:
      - etl

  train:
    build:
      context: docker/train
      dockerfile: Dockerfile
    image: radiocovid-train:0.1.1
    shm_size: '2g'
    volumes:
      - ./data:/data
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./logs:/workspace/logs
    environment:
      WANDB_MODE: ${WANDB_MODE:-offline}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
    profiles:
      - train

  inference:
    build:
      context: .
      dockerfile: docker/inference/Dockerfile
    image: radiocovid-inference:0.1.0
    ports:
      - "8000:8000"
    environment:
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      WANDB_ENTITY: ${WANDB_ENTITY:-}
      WANDB_PROJECT: ${WANDB_PROJECT:-radiocovid}
      WANDB_REGISTERED_MODEL_NAME: ${WANDB_REGISTERED_MODEL_NAME:-radiocovid-classifier}
      WANDB_REGISTRY_COLLECTION: ${WANDB_REGISTRY_COLLECTION:-radiocovid-classifier}
    profiles:
      - inference
